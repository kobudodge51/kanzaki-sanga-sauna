/* ====== 忘れ物 ====== */
function vLost(){const f=UI.lostFilter,cf=UI.lostCat;const list=S.lost.filter(l=>(f==='すべて'||l.status===f)&&(cf==='すべて'||(l.cat||'その他')===cf)).sort((a,b)=>a.date<b.date?1:-1);
  const exp=S.lost.filter(l=>l.status==='保管中'&&lostDue(l)<todayStr).length;
  return phead('LOST & FOUND','忘れ物','<button class="btn" data-a="lostBulk">まとめて登録</button><button class="btn primary" data-a="lostNew">忘れ物を登録</button>')+
  `<div class="chips">${['保管中','返却済','処分','すべて'].map(c=>`<button class="${f===c?'on':''}" data-a="set" data-k="lostFilter" data-v="${c}">${c}${c==='保管中'?`（${S.lost.filter(l=>l.status==='保管中').length}）`:''}</button>`).join('')}</div>
  <div class="chips">${['すべて',...S.settings.lostCats].map(c=>`<button class="${cf===c?'on':''}" data-a="set" data-k="lostCat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  ${exp?`<div class="alert bad"><span class="dot"></span><span>保管期限（発見から${S.settings.lostDays}日）を過ぎた忘れ物が ${exp}件 あります。「処分する」か「保管を続ける」を選んでください。</span></div>`:''}
  <div class="list">${list.map(l=>{const due=lostDue(l);const n=diffDays(due,todayStr);const ex=l.status==='保管中'&&n<0;return `<div class="item"><div class="t1"><span class="pill">${esc(l.cat||'その他')}</span>${esc(l.name||'')}<span class="sp"></span>${l.status==='保管中'?`<span class="pill ${ex?'bad':n<=3?'warn':''}">${ex?`期限切れ（${-n}日過ぎ）`:`期限まであと${n}日`}</span>`:`<span class="pill ${l.status==='返却済'?'ok':''}">${l.status}</span>`}</div>
   <div class="meta"><span>発見日 ${dLabel(l.date)}</span><span>発見場所：${esc(l.found)}</span><span>発見者：${esc(finderTxt(l.finder))}</span>${l.storage?`<span>保管：${esc(l.storage)}</span>`:''}${l.keepUntil?`<span>保管延長 ${dLabel(l.keepUntil)}まで</span>`:''}${l.contact?`<span>問い合わせ：${esc(l.contact)}</span>`:''}${l.status==='返却済'?`<span>返却 ${dLabel(l.returnDate)}（${esc(l.method||'')}）</span>`:''}${l.status==='処分'?`<span>処分 ${dLabel(l.disposedDate)}</span>`:''}</div>${l.note?`<div class="meta"><span>${esc(l.note)}</span></div>`:''}
   <div class="acts">${l.status==='保管中'?`<button class="btn sm ok" data-a="lostReturn" data-id="${l.id}">返却を記録</button>${ex?`<button class="btn sm danger" data-a="lostDispose" data-id="${l.id}">処分する</button><button class="btn sm" data-a="lostKeep" data-id="${l.id}">保管を続ける（+${S.settings.lostDays}日）</button>`:''}`:''}<button class="btn sm" data-a="lostEdit" data-id="${l.id}">編集</button></div></div>`}).join('')||'<p class="empty">該当する忘れ物はありません</p>'}</div>`}
function lostBulkRow(){const cats=S.settings.lostCats,places=S.settings.places;const staffs=[...activeStaff().map(s=>[s.id,s.name]),['guest','お客様']];
  return `<tr class="lb-row"><td><select class="inp lb-cat"><option value="">―</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></td><td><input class="inp lb-name" placeholder="例：黒い長財布"></td><td><input class="inp lb-date" type="date" value="${todayStr}"></td><td><select class="inp lb-found">${places.map(p=>`<option>${esc(p)}</option>`).join('')}</select></td><td><select class="inp lb-finder">${staffs.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join('')}</select></td><td><input class="inp lb-storage" value="受付裏の棚"></td><td><button type="button" class="btn sm danger" data-a="lbDel" aria-label="この行を削除">×</button></td></tr>`}
function lostBulkModal(){modal('忘れ物をまとめて登録',`<p class="note">1行に1つずつ入れてください。「種類」が空の行は登録されません。「その他」を選んだときは品名を必ず書いてください。日付・場所・発見者は、1行目を変えると下の行も同じ値になります。</p>
  <div class="tbl-wrap"><table class="lbtable"><thead><tr><th>種類</th><th>品名・特徴</th><th>発見日</th><th>発見場所</th><th>発見者</th><th>保管場所</th><th></th></tr></thead><tbody id="lb-body">${[1,2,3,4,5].map(lostBulkRow).join('')}</tbody></table></div>
  <div><button type="button" class="btn" data-a="lbAdd">＋ 5行追加</button></div>`,{wide:true,nofocus:true,saveLabel:'まとめて登録',save:()=>{const rows=[...document.querySelectorAll('.lb-row')].map(r=>({cat:r.querySelector('.lb-cat').value,name:r.querySelector('.lb-name').value.trim(),date:r.querySelector('.lb-date').value,found:r.querySelector('.lb-found').value,finder:r.querySelector('.lb-finder').value,storage:r.querySelector('.lb-storage').value,el:r})).filter(r=>r.cat||r.name);
    if(!rows.length){toast('1行以上入力してください');return false}const bad=rows.filter(r=>!r.cat||(r.cat==='その他'&&!r.name));if(bad.length){bad.forEach(r=>r.el.classList.add('err'));toast(`種類が空か、「その他」で品名がない行が${bad.length}件あります（赤い行）`);return false}
    rows.forEach(r=>S.lost.push({id:uid(),date:r.date||todayStr,cat:r.cat,name:r.name,found:r.found,finder:r.finder,storage:r.storage,contact:'',note:'',status:'保管中'}));toast(`${rows.length}件の忘れ物を登録しました`)}})}
function lostModal(id){const l=S.lost.find(x=>x.id===id)||{date:todayStr,cat:'',name:'',found:S.settings.places[0],finder:isShared()?(S.staff[0]||{}).id:me.id,storage:'受付裏の棚',contact:'',note:''};
  modal(id?'忘れ物を編集':'忘れ物を登録',`${fld('種類',seg('cat',S.settings.lostCats,l.cat))}${fld('品名・特徴（「その他」を選んだときは必ず書いてください）',inp('name',l.name,'text','placeholder="例：黒い長財布、緑のフェルトのサウナハット"'))}
  <div class="frow">${fld('発見日',inp('date',l.date,'date'))}${fld('発見場所',sel('found',S.settings.places,l.found))}${fld('発見者',sel('finder',[...activeStaff(l.finder).map(s=>[s.id,s.name]),['guest','お客様']],l.finder))}</div>
  <div class="frow">${fld('保管場所',inp('storage',l.storage))}${fld('お客様からの問い合わせ（連絡先など）',inp('contact',l.contact))}</div>${fld('メモ',inp('note',l.note))}${id?`<div id="delzone"><button type="button" class="btn sm danger" data-a="askDel" data-k="lost" data-id="${id}">この記録を削除</button></div>`:''}`,
  {nofocus:true,save:f=>{if(!f.cat){toast('種類を選んでください');return false}if(f.cat==='その他'&&!String(f.name||'').trim()){toast('「その他」のときは品名を書いてください');return false}const o={date:f.date,cat:f.cat,name:String(f.name||'').trim(),found:f.found,finder:f.finder,storage:f.storage,contact:f.contact,note:f.note};if(id)Object.assign(l,o);else S.lost.push({id:uid(),...o,status:'保管中'});toast('保存しました')}})}

/* ====== 引き継ぎ ====== */
const hoTo=t=>t==='all'?'全員':t==='admin'?'社員・主宰':staffName(t);
const hoDone=h=>h.done||(h.to!=='all'&&h.to!=='admin'&&(h.checks||[]).some(c=>c.staffId===h.to));
const nowStr=()=>{const d=new Date();return `${todayStr} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
function handoverCard(){const f=UI.hoFilter||'未確認';const list=S.handovers.filter(h=>f==='すべて'||!hoDone(h)).sort((a,b)=>(b.at||b.date)<(a.at||a.date)?-1:1);
  return `<div class="card"><h2>引き継ぎ ${S.handovers.filter(h=>!hoDone(h)).length?`<span class="badge">${S.handovers.filter(h=>!hoDone(h)).length}</span>`:''}<span class="r"><button class="btn primary sm" data-a="hoNew">引き継ぎを書く</button></span></h2>
  <div class="chips">${['未確認','すべて'].map(c=>`<button class="${f===c?'on':''}" data-a="set" data-k="hoFilter" data-v="${c}">${c==='未確認'?'まだ終わっていないもの':'すべて'}</button>`).join('')}</div>
  <div class="list">${list.map(h=>`<div class="item ho ${hoDone(h)?'done':''}"><div class="t1"><span class="ho-from">${esc(staffName(h.from))}</span><span class="muted">→</span><span class="ho-to">${esc(hoTo(h.to))}</span><span class="sp"></span><small class="muted">${dLabel(h.date)}${h.at?' '+h.at.slice(11):''}</small>${hoDone(h)?'<span class="pill ok">完了</span>':''}</div>
   <div class="ho-text">${esc(h.text).replace(/\n/g,'<br>')}</div>
   <div class="meta">${(h.checks||[]).length?`<span>確認済み：${h.checks.map(c=>`<b>${esc(staffName(c.staffId))}</b>（${dLabel(c.at.slice(0,10))} ${c.at.slice(11)}）`).join('、')}</span>`:'<span class="ho-none">まだ誰も確認していません</span>'}</div>
   <div class="acts">${hoDone(h)?'':`<button class="btn sm ok" data-a="hoCheck" data-id="${h.id}">確認しました</button>`}${!h.done&&(h.to==='all'||h.to==='admin')&&isAdmin()?`<button class="btn sm" data-a="hoClose" data-id="${h.id}">完了にする</button>`:''}<button class="btn sm" data-a="hoEdit" data-id="${h.id}">編集</button></div></div>`).join('')||'<p class="empty">引き継ぎはありません</p>'}</div>
  <p class="note">相手を1人に決めた引き継ぎは、その人が「確認しました」を押すと完了になります。「全員」「社員・主宰」あての引き継ぎは、主宰・社員が「完了にする」を押すまで表示されます。</p></div>`}
function hoModal(id){const h=S.handovers.find(x=>x.id===id)||{date:todayStr,from:isShared()?'':me.id,to:'all',text:''};
  const tos=[['all','全員'],['admin','社員・主宰'],...activeStaff(h.to).map(s=>[s.id,s.name])];
  modal(id?'引き継ぎを編集':'引き継ぎを書く',`<div class="frow">${fld('書いた人',sel('from',[['','（選んでください）'],...activeStaff(h.from).map(s=>[s.id,s.name])],h.from))}${fld('日付',inp('date',h.date,'date'))}</div>
  ${fld('誰に向けて',seg('to',tos,h.to))}
  ${fld('引き継ぐこと',ta('text',h.text,5))}${id?`<div id="delzone"><button type="button" class="btn sm danger" data-a="askDel" data-k="handovers" data-id="${id}">この引き継ぎを削除</button></div>`:''}`,
  {nofocus:true,save:f=>{if(!f.from){toast('書いた人を選んでください');return false}if(!String(f.text||'').trim()){toast('引き継ぐことを書いてください');return false}const o={date:f.date,from:f.from,to:f.to||'all',text:f.text.trim()};if(id)Object.assign(h,o);else S.handovers.push({id:uid(),...o,at:nowStr(),checks:[],done:false});toast('引き継ぎを保存しました')},saveLabel:id?'保存':'引き継ぎを残す'})}
function hoCheckModal(id){const h=S.handovers.find(x=>x.id===id);if(!h)return;
  if(!isShared()){(h.checks=h.checks||[]).push({staffId:me.id,at:nowStr()});save();render();toast('確認済みにしました');return}
  const def=h.to!=='all'&&h.to!=='admin'?h.to:'';
  modal('誰が確認しましたか',`<div class="ho-text" style="background:var(--surface2);border-radius:8px;padding:12px 14px">${esc(h.text).replace(/\n/g,'<br>')}</div>${fld('確認した人',seg('who',activeStaff().filter(s=>!(h.checks||[]).some(c=>c.staffId===s.id)).map(s=>[s.id,s.name]),def))}`,
  {nofocus:true,saveLabel:'確認しました',save:f=>{if(!f.who){toast('確認した人を選んでください');return false}(h.checks=h.checks||[]).push({staffId:f.who,at:nowStr()});toast(`${staffName(f.who)}さんの確認を記録しました`)}})}

/* ====== リマインド ====== */
function vRemind(){const all=allReminders();const now=all.filter(r=>r.show);const soon=all.filter(r=>!r.show&&diffDays(r.date,todayStr)<=45);
  const mine=S.reminders.filter(r=>!r.to||r.to==='all'||r.to===me.id).sort((a,b)=>a.date<b.date?-1:1);
  const leadTxt=n=>({0:'当日',1:'前日から',3:'3日前から',7:'1週間前から',14:'2週間前から'}[n]||n+'日前から');
  const row=r=>`<div class="alert ${remCls(r.date)}"><span class="dot"></span><span>${esc(r.title)} <small class="muted">${esc(r.cat)}・${dLabel(r.date)}</small></span><span class="when">${whenTxt(r.date)}</span>${r.custom?`<button class="btn sm ok" data-a="remDone" data-id="${r.id}">完了</button>`:`<button class="btn sm" data-a="go" data-v="${r.go}">開く</button>`}</div>`;
  return phead('REMINDERS','リマインド・引き継ぎ','<button class="btn" data-a="remNew">リマインドを追加</button>')+handoverCard()+
  `<div class="card"><h2>今お知らせしているもの <span class="badge">${now.length}</span></h2>${now.length?`<div class="alerts">${now.map(row).join('')}</div>`:'<p class="empty">今お知らせするものはありません</p>'}</div>
  <div class="card"><h2>これから（45日以内）</h2>${soon.length?`<div class="alerts">${soon.map(row).join('')}</div>`:'<p class="empty">ありません</p>'}</div>
  <div class="card"><h2>自分で作ったリマインド</h2>${mine.length?`<div class="tbl-wrap"><table><thead><tr><th>内容</th><th>日付</th><th>表示</th><th>対象</th><th>状態</th><th></th></tr></thead><tbody>${mine.map(r=>`<tr><td>${esc(r.title)}</td><td>${dLabel(r.date)}</td><td>${leadTxt(+r.lead)}</td><td>${r.to==='all'||!r.to?'全員':esc(staffName(r.to))}</td><td>${r.done?'<span class="pill ok">完了</span>':'<span class="pill">未完了</span>'}</td><td><button class="btn sm" data-a="remEdit" data-id="${r.id}">編集</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">ありません</p>'}</div>
  <p class="note">シフト希望の締切・明日の出勤・備品の点検日・イベント準備・在庫不足・忘れ物の保管期限は自動でお知らせします。今はこの画面とホームに表示されます。次の段階で、LINEへの通知を追加する予定です。</p>`}
function remModal(id){const r=S.reminders.find(x=>x.id===id)||{title:'',date:addDays(todayStr,7),lead:1,cat:'その他',to:'all',done:false};
  modal(id?'リマインドを編集':'リマインドを追加',`${fld('内容',inp('title',r.title,'text','placeholder="例：消防設備点検の立ち会い"'))}<div class="frow">${fld('日付',inp('date',r.date,'date'))}${fld('いつから表示するか',sel('lead',[[0,'当日'],[1,'前日から'],[3,'3日前から'],[7,'1週間前から'],[14,'2週間前から']],r.lead))}</div><div class="frow">${fld('分類',sel('cat',['シフト','点検・交換','イベント準備','在庫','忘れ物','その他'],r.cat))}${fld('誰に表示するか',sel('to',[['all','全員'],...activeStaff().map(s=>[s.id,s.name])],r.to||'all'))}</div>${id?`<label class="check"><input type="checkbox" name="done" value="1" ${r.done?'checked':''}>完了にする</label><div id="delzone"><button type="button" class="btn sm danger" data-a="askDel" data-k="reminders" data-id="${id}">削除</button></div>`:''}`,
  {save:f=>{if(!f.title){toast('内容を入力してください');return false}const o={title:f.title,date:f.date,lead:+f.lead,cat:f.cat,to:f.to};if(id)Object.assign(r,o,{done:!!f.done});else S.reminders.push({id:uid(),...o,done:false})}})}

const IMP={
 shift:{title:'シフト',desc:'日付・名前・出勤・退勤を1行に1件。休憩（分）が空欄なら、勤務時間から自動で入れます（6時間超45分・8時間超60分）。出勤・退勤の代わりに「区分」の列に「早番」など、設定の「よく使う時間」の名前を書くこともできます。',
   head:['日付','名前','出勤','退勤','休憩'],ex:[['2026/11/1','バイトA','8:00','10:00',''],['2026/11/1','社員A','8:00','22:00','60'],['2026/11/1','バイトB','10:00','22:00','60'],['2026/11/1','バイトC','13:00','22:00','']]},
 expense:{title:'経費',desc:'日付・科目・内容・金額を1行に1件。申請者は空欄でもかまいません。科目が新しい名前なら、自動で科目に追加します。',
   head:['日付','科目','内容','金額','申請者'],ex:[['2026/10/5','仕入れ・消耗品','白樺ヴィヒタ 20束','18000',''],['2026/10/12','修繕・設備費','小屋サウナ 扉修理','12500','']]},
 pay:{title:'給料（時給・交通費）',desc:'スタッフごとの時給と1出勤あたりの交通費。名前が見つからないスタッフは新しく追加します。区分は「主宰」「社員」「バイト」のどれか（空欄ならバイト）。',
   head:['名前','区分','時給','交通費'],ex:[['バイトA','バイト','1100','500'],['バイトB','バイト','1100','500']]}};
function vImport(){return phead('IMPORT','スプレッドシート取込')+
  `<p class="note">ExcelファイルやGoogleスプレッドシートから、シフト・経費・給料のデータを取り込めます。方法は2つです。<br>① ファイルを選ぶ（.xlsx／.xls／.csv）。Googleスプレッドシートは「ファイル」→「ダウンロード」→「Microsoft Excel（.xlsx）」で保存したファイルを選んでください。<br>② スプレッドシートのセルを見出しごと範囲選択してコピーし、下の枠に貼り付ける。</p>`+
  Object.entries(IMP).map(([k,o])=>{const st=UI.imp[k];return `<div class="card"><h2>${o.title}の取込<span class="r"><button class="btn sm" data-a="impTpl" data-k="${k}">見出しと例をコピー</button></span></h2><p class="muted" style="font-size:14px">${o.desc}</p>
  <div class="tbl-wrap"><table><thead><tr>${o.head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${o.ex.map(r=>`<tr>${r.map(c=>`<td class="num">${esc(c)||'<span class="muted">空欄</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>

function cellDate(v){if(v==null||v==='')return '';if(v instanceof Date){const d=new Date(v.getTime()+3600e3);return ymd(d)}if(typeof v==='number'&&v>20000){const d=new Date(Math.round((v-25569)*864e5));return ymd(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}
  let s=String(v).trim().replace(/[年月\.]/g,'/').replace(/日/,'').replace(/\(.\)|（.）/,'').trim();let m=s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);if(m)return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;m=s.match(/^(\d{1,2})\/(\d{1,2})$/);if(m)return `${TODAY.getFullYear()}-${pad(m[1])}-${pad(m[2])}`;return ''}
function cellTime(v){if(v==null||v==='')return '';if(v instanceof Date){const d=new Date(v.getTime()+30e3);return `${pad(d.getHours())}:${pad(d.getMinutes())}`}if(typeof v==='number'&&v<1){const m=Math.round(v*1440);return `${pad(Math.floor(m/60))}:${pad(m%60)}`}const m=String(v).trim().replace('：',':').match(/^(\d{1,2}):(\d{2})/);return m?`${pad(m[1])}:${m[2]}`:''}
const num=v=>{const n=+String(v??'').replace(/[¥,円\s]/g,'');return isNaN(n)?NaN:n};
function findCol(h,names){return h.findIndex(x=>names.some(n=>String(x||'').replace(/\s/g,'').includes(n)))}
function parseImport(k,rows){rows=rows.filter(r=>r&&r.some(c=>c!==''&&c!=null));if(rows.length<2)return{rows:[],errs:['見出し行とデータ行が必要です'],cols:[]};const h=rows[0];const data=rows.slice(1);const errs=[],out=[];const known=new Set(S.staff.map(s=>s.name));const newStaff=new Set();
  if(k==='shift'){const c={d:findCol(h,['日付','日にち','date']),n:findCol(h,['名前','氏名','スタッフ']),t:findCol(h,['区分','シフト']),s:findCol(h,['開始','出勤','始']),e:findCol(h,['終了','退勤','終']),b:findCol(h,['休憩'])};
    if(c.d<0||c.n<0)return{rows:[],errs:['見出しに「日付」と「名前」が見つかりません'],cols:[]};
    data.forEach((r,i)=>{const d=cellDate(r[c.d]),n=String(r[c.n]??'').trim();const t=c.t>=0?String(r[c.t]??'').trim():'';let s=c.s>=0?cellTime(r[c.s]):'',e=c.e>=0?cellTime(r[c.e]):'';if((!s||!e)&&t){const p=S.settings.presets.find(p=>p.name===t||p.name.startsWith(t)||t.startsWith(p.name));if(p){s=p.s;e=p.e}}const b=c.b>=0&&r[c.b]!==''&&r[c.b]!=null?num(r[c.b]):NaN;
      if(!d||!n||!s||!e){errs.push(`${i+2}行目`);return}if(!known.has(n))newStaff.add(n);out.push({日付:d,名前:n,出勤:s,退勤:e,休憩:isNaN(b)?brkDefault(s,e):b})});return{rows:out,errs,cols:['日付','名前','出勤','退勤','休憩'],newStaff:[...newStaff]}}
  if(k==='expense'){const c={d:findCol(h,['日付']),c:findCol(h,['科目','分類','カテゴリ']),x:findCol(h,['内容','摘要','品名']),a:findCol(h,['金額','税込']),p:findCol(h,['申請','名前'])};
    if(c.d<0||c.a<0)return{rows:[],errs:['見出しに「日付」と「金額」が見つかりません'],cols:[]};
    data.forEach((r,i)=>{const d=cellDate(r[c.d]),a=num(r[c.a]);if(!d||isNaN(a)){errs.push(`${i+2}行目`);return}out.push({日付:d,科目:c.c>=0?String(r[c.c]??'').trim()||'その他':'その他',内容:c.x>=0?String(r[c.x]??''):'',金額:a,申請者:c.p>=0?String(r[c.p]??'').trim():''})});return{rows:out,errs,cols:['日付','科目','内容','金額','申請者']}}
  const c={n:findCol(h,['名前','氏名']),r:findCol(h,['役割','役職']),w:findCol(h,['時給']),t:findCol(h,['交通費'])};
  if(c.n<0)return{rows:[],errs:['見出しに「名前」が見つかりません'],cols:[]};
  data.forEach((r,i)=>{const n=String(r[c.n]??'').trim();if(!n){errs.push(`${i+2}行目`);return}let role=c.r>=0?String(r[c.r]??'').trim():'';if(!['主宰','社員','バイト'].includes(role))role='';const w=c.w>=0?num(r[c.w]):NaN,t=c.t>=0?num(r[c.t]):NaN;if(!known.has(n))newStaff.add(n);out.push({名前:n,役割:role||'（変更なし）',時給:isNaN(w)?'':w,交通費:isNaN(t)?'':t})});return{rows:out,errs,cols:['名前','役割','時給','交通費'],newStaff:[...newStaff]}}
function ensureStaff(n,role){let s=S.staff.find(x=>x.name===n);if(!s){s={id:'s'+uid(),name:n,role:role||'バイト',pw:'1234',pat:'14789',payroll:true};S.staff.push(s)}return s}
function impCommit(k){const st=UI.imp[k];if(!st)return;let n=0;
  if(k==='shift'){const over=!$('#imp-over')||$('#imp-over').checked;st.rows.forEach(r=>{const s=ensureStaff(r.名前);const ex=S.shifts.find(x=>x.staffId===s.id&&x.date===r.日付);if(ex&&!over)return;S.shifts=S.shifts.filter(x=>!(x.staffId===s.id&&x.date===r.日付));S.shifts.push({id:uid(),staffId:s.id,date:r.日付,start:r.出勤,end:r.退勤,brk:r.休憩});n++})}
  else if(k==='expense'){st.rows.forEach(r=>{if(!S.settings.expCats.includes(r.科目))S.settings.expCats.push(r.科目);const p=r.申請者?ensureStaff(r.申請者):me;S.expenses.push({id:uid(),date:r.日付,cat:r.科目,desc:r.内容,amount:r.金額,staffId:p.id,status:'承認',receipt:''});n++})}
  else st.rows.forEach(r=>{const s=ensureStaff(r.名前,r.役割==='（変更なし）'?'':r.役割);if(r.役割!=='（変更なし）')s.role=r.役割;if(r.時給!=='')s.wage=r.時給;if(r.交通費!=='')s.transit=r.交通費;n++});
  delete UI.imp[k];S.sample=S.sample&&k!=='pay';save();render();toast(`${n}件を取り込みました`)}

document.addEventListener('submit',e=>{if(e.target.id==='mform'){e.preventDefault();ACT.msave()}});
document.addEventListener('paste',siPaste);
document.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('si'))siMark(e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='gate-pw'){e.preventDefault();ACT.gateGo();return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();
  const t=e.target;if(t.classList&&t.classList.contains('bk')&&(e.key==='Enter'||e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const all=[...document.querySelectorAll(`input.bk[data-d="${t.dataset.d}"]`)];const i=all.indexOf(t)+(e.key==='ArrowUp'?-1:1);if(all[i]){all[i].focus();all[i].select()}}});
document.addEventListener('change',e=>{const t=e.target;const c=t.closest&&t.closest('.bkc');if(!c)return;if(t.classList.contains('bks')&&t.value&&t.value!=='off'){const en=c.querySelector('.bke');if(!en.value||en.value===t.value){const p=S.settings.presets.find(p=>p.s===t.value);const v=p?p.e:addMin(t.value,9*60);bkEnsure(en,v);en.value=v}}bkMark(c)});
document.addEventListener('click',e=>{if(UI.paint==null)return;const c=e.target.closest&&e.target.closest('.bkc');if(!c)return;e.preventDefault();bkSet(c,UI.paint,UI.paint===''?'':undefined)},true);
document.addEventListener('change',e=>{const t=e.target;const r=t.closest&&t.closest('.lb-row');if(!r)return;r.classList.remove('err');const rows=[...document.querySelectorAll('.lb-row')];if(rows[0]!==r)return;['lb-date','lb-found','lb-finder','lb-storage'].forEach(k=>{if(t.classList.contains(k))rows.slice(1).forEach(x=>{const f=x.querySelector('.'+k);if(f&&!x.querySelector('.lb-cat').value)f.value=t.value})})});

document.addEventListener('input',e=>{const t=e.target;if(t.dataset.c==='manQ'){UI.manQ=t.value;const pos=t.selectionStart;render();const n=$('#manq');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}});
document.addEventListener('change',async e=>{const t=e.target,c=t.dataset.c;
  if(t.dataset.img&&t.files&&t.files[0]){const url=await compress(t.files[0]);const h=document.getElementById(t.dataset.img);h.value=url;const p=document.getElementById(t.dataset.img.replace('f-','p-'));if(p){p.src=url;p.hidden=!url}return}
  if(t.dataset.impfile&&t.files&&t.files[0]){const k=t.dataset.impfile;if(typeof XLSX==='undefined'){toast('ファイル読込の部品を読み込めませんでした。貼り付けで取り込んでください');return}const buf=await t.files[0].arrayBuffer();try{const wb=XLSX.read(buf,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});UI.imp[k]=parseImport(k,rows);render()}catch(err){toast('ファイルを読み込めませんでした。形式を確認してください')}return}
  if(c==='pay'){UI.pay=t.value;render();return}
  if(c==='oiPick'){const k=knownItems()[+t.value];if(k){const l=$('#oi-list');const first=l&&l.children.length===1&&!l.querySelector('input[name=i_name]').value;if(first)l.innerHTML='';l.insertAdjacentHTML('beforeend',oiRow({...k,qty:''}));const q=l.lastElementChild.querySelector('input[name=i_qty]');if(q)q.focus()}t.value='';return}
  if(t.dataset.cs){const k=t.dataset.cs,C=S.settings.cancel;if(k==='slots'){const v=t.value.split('\n').map(x=>x.trim()).filter(Boolean);if(!v.length)return;C.slots=v}else if(k==='rules'){const v=t.value.split('\n').map(x=>x.split(/[,，、]/)).filter(x=>x[0]&&x[0].trim()).map(x=>({name:x[0].trim(),rate:+(x[1]||0)}));if(!v.length)return;C.rules=v}else C[k]=(k==='price'||k==='deadlineDays')?+t.value:t.value;save();toast('保存しました');return}
  if(t.dataset.co){S.settings.cashOpening=Object.assign({date:'',amount:0},S.settings.cashOpening,{[t.dataset.co]:t.dataset.co==='amount'?+t.value:t.value});save();toast('保存しました');return}
  if(t.dataset.wc!==undefined){const d=+t.dataset.wc;const a=new Set(S.settings.weeklyClosed||[]);t.checked?a.add(d):a.delete(d);S.settings.weeklyClosed=[...a];save();toast('定休日を保存しました');return}
  if(t.dataset.we!==undefined){const w=S.settings.weeklyEvents[+t.dataset.we];if(!w)return;const k=t.dataset.p;if(k==='tasks')w.tasks=t.value.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(\d{1,2})[:：](\d{2})\s*(.*)$/);return m?{time:pad(+m[1])+':'+m[2],text:m[3]||''}:{time:'',text:x}});else w[k]=k==='dow'?+t.value:t.value;save();toast('保存しました');return}
  if(c==='anaFrom'||c==='anaTo'){const def=anaPreset(UI.anaPre||'m12');UI.anaFrom=UI.anaFrom||def[0];UI.anaTo=UI.anaTo||def[1];UI[c]=t.value;if(UI.anaFrom>UI.anaTo){if(c==='anaFrom')UI.anaTo=UI.anaFrom;else UI.anaFrom=UI.anaTo}render();return}
  if(c==='anaCmp'){UI.anaCmp=t.value;render();return}
  if(c==='attPay'){UI.attPay=t.value;render();return}
  if(c==='attBy'){UI.attBy=t.value;S.settings.attChecker=t.value;save();toast(`確認する人を「${t.value}」にしました`);return}
  if(t.dataset.salesfile&&t.files&&t.files[0]){if(typeof XLSX==='undefined'){toast('ファイル読込の部品を読み込めませんでした');return}const f=t.files[0];try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});SXWB={};wb.SheetNames.forEach(n=>{SXWB[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})});const first=wb.SheetNames.find(n=>SXWB[n].length>1)||wb.SheetNames[0];UI.sx={name:f.name,sheet:first,map:null};render()}catch(e){toast('このファイルは読み込めませんでした')}return}
  if(c==='sxSheet'){UI.sx.sheet=t.value;UI.sx.map=null;render();return}
  if(c==='sxCol'){UI.sx.map[t.dataset.k]=+t.value;render();return}
  if(c==='weekAll'){UI.weekAll=t.checked;render();return}
  if(c==='bulk14'){if(bkDirty()){t.checked=!t.checked;toast('先に「この表を保存」を押してください');return}UI.bulkDays=t.checked?14:7;render();return}
  if(c==='hopeStaff'){UI.hopeStaff=t.value;render();return}
  if(c==='fiscalEnd'){S.settings.fiscalEnd=+t.value;UI.planFY=fyOf(todayStr);save();render();toast(`決算月を${t.value}月にしました`);return}
  if(c==='evChk'){const ev=S.events.find(x=>x.id===t.dataset.id);ev.checklist[+t.dataset.i].done=t.checked;save();render();return}
  if(c==='iniDone'){const i=S.plans.initiatives.find(x=>x.id===t.dataset.id);i.done=t.checked;save();render();return}
  if(c==='skillOn'){S.settings.skillOn=t.checked;save();toast(t.checked?'スキルチェックをONにしました':'スキルチェックをOFFにしました');return}
  if(t.closest&&t.closest('#mform')&&t.name==='type'){evTypeSync();[1,2,3].forEach(evStartSync);}
  if(t.dataset&&t.dataset.evs){evStartSync(+t.dataset.evs)}
  if(c==='evType'){const n=document.getElementById('f-newType');if(n&&t.value==='__new')n.focus();return}
  if(t.dataset.s){S.settings[t.dataset.s]=t.dataset.num?+t.value:t.value;save();toast('保存しました');if(t.dataset.s==='closeDay')UI.pay=curPay();return}
  if(t.dataset.pre!==undefined){const pr=S.settings.presets[+t.dataset.pre];if(pr){pr[t.dataset.p]=t.value;save();toast('保存しました')}return}
  if(t.dataset.lead){S.settings.leads[t.dataset.lead]=+t.value;save();toast('保存しました');return}
  if(t.dataset.list){const v=t.value.split('\n').map(s=>s.trim()).filter(Boolean);if(!v.length){toast('1つ以上入力してください');return}S.settings[t.dataset.list]=[...new Set(v)];save();toast('カテゴリーを保存しました');return}
});
boot();
</script>
</body>
</html>
